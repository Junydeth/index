<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 편의점 조합 찾기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 40px 20px;
    text-align: center;
}

h1 {
    font-size: 38px;
    margin: 70px 0 50px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

button {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 22px 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ff8534;
    color: white;
    border-color: #ff8534;
}

#result {
    max-width: 550px;
    margin: 45px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    line-height: 2;
    font-size: 17px;
    display: none;
}

@media(max-width: 500px) {
    h1 {
        font-size: 29px;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<h1>랜덤 편의점 조합 찾기</h1>

<div class="buttons">
    <button onclick="generateRandom()">완전 랜덤</button>
    <button onclick="generateCategory()">분류 랜덤</button>
</div>

<div id="result"></div>

<script>

// 편의점 식품 데이터
const foods = {

    "컵라면": [
        "육개장 사발면", "김치 사발면", "신라면 컵",
        "신라면 큰사발", "진라면 매운맛 컵",
        "진라면 순한맛 컵", "열라면 컵", "참깨라면 컵",
        "삼양라면 컵", "안성탕면 컵", "너구리 컵",
        "오징어짬뽕 컵", "사리곰탕 컵", "튀김우동 컵",
        "새우탕 컵", "왕뚜껑", "김치왕뚜껑",
        "불닭볶음면 컵", "까르보불닭 컵", "로제불닭 컵",
        "4가지치즈 불닭 컵", "짜파게티 범벅",
        "사천 짜파게티 컵", "공화춘 짜장",
        "공화춘 짬뽕", "라면볶이", "치즈볶이",
        "스파게티 컵", "컵누들 매콤한맛",
        "컵누들 우동맛", "컵누들 로제맛",
        "컵누들 매콤찜닭맛"
    ],

    "도시락": ["편의점 도시락"],

    "삼각김밥": [
        "참치마요 삼각김밥", "전주비빔 삼각김밥",
        "참치김치 삼각김밥", "스팸마요 삼각김밥",
        "불고기 삼각김밥", "제육볶음 삼각김밥"
    ],

    "김밥": [
        "참치김밥", "참치마요김밥", "돈까스김밥",
        "제육김밥", "불고기김밥", "치즈김밥",
        "야채김밥", "계란김밥", "묵은지참치김밥"
    ],

    "샌드위치": [
        "에그마요 샌드위치", "햄치즈 샌드위치",
        "BLT 샌드위치", "참치마요 샌드위치",
        "감자샐러드 샌드위치", "닭가슴살 샌드위치",
        "치킨 샌드위치"
    ],

    "음료": [
        "코카콜라", "펩시콜라", "칠성사이다",
        "스프라이트", "환타 오렌지", "환타 파인애플",
        "밀키스", "포카리스웨트", "파워에이드",
        "토레타", "웰치스 포도", "갈아만든 배",
        "쥬시쿨", "조지아 오리지널", "TOP 아메리카노",
        "바리스타룰스 라떼", "바나나우유",
        "초코우유", "딸기우유", "흰우유",
        "아이스티", "옥수수수염차", "헛개차",
        "보리차", "17차"
    ]

};


// 모든 재료 합치기
const allFoods = Object.values(foods).flat();


// 무작위 선택
function randomChoice(array) {
    return array[Math.floor(Math.random() * array.length)];
}


// 결과 출력
function showResult(title, items) {

    const result = document.getElementById("result");

    result.style.display = "block";

    result.innerHTML = `
        <h2>${title}</h2>
        ${items.map(item => `<div>${item}</div>`).join("")}
    `;

}


// 완전 랜덤
function generateRandom() {

    let pool = [...allFoods];
    let selected = [];

    for(let i = 0; i < 3; i++) {

        let index = Math.floor(Math.random() * pool.length);

        selected.push(pool[index]);

        pool.splice(index, 1);

    }

    showResult("완전 랜덤 결과", selected);

}


// 분류 랜덤
function generateCategory() {

    const mainCategories = [
        "컵라면", "도시락", "삼각김밥",
        "김밥", "샌드위치"
    ];

    let mainCategory = randomChoice(mainCategories);

    let otherCategories = mainCategories.filter(
        category => category !== mainCategory
    );

    let subCategory = randomChoice(otherCategories);

    let selected = [
        randomChoice(foods[mainCategory]),
        randomChoice(foods[subCategory]),
        randomChoice(foods["음료"])
    ];

    showResult("분류 랜덤 결과", selected);

}

</script>

</body>
</html>
